name: Version Bump and Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      preid:
        description: Prerelease identifier (only used when bump = prerelease)
        required: false
        default: beta
        type: string

permissions:
  contents: write # required to push the version commit and tag
  actions: write # required to dispatch the publish workflow (workflow_dispatch)

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A pushed tag cannot trigger publish.yml's `on: push` when the push is
          # made with GITHUB_TOKEN. Instead of relying on a PAT, this workflow
          # explicitly dispatches publish.yml via workflow_dispatch at the end
          # (GITHUB_TOKEN is permitted to trigger workflow_dispatch). A PAT
          # (secrets.RELEASE_PAT) is still honored if present.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute and apply version bump
        id: version
        run: |
          if [ "${{ inputs.bump }}" = "prerelease" ]; then
            NEW_VERSION="$(npm version prerelease --preid="${{ inputs.preid }}" --no-git-tag-version)"
          else
            NEW_VERSION="$(npm version "${{ inputs.bump }}" --no-git-tag-version)"
          fi
          # npm version prints the new version prefixed with "v" (e.g. v4.2.0)
          echo "tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Sync VERSION constant in src/pptxgen.ts
        run: |
          NUMBER="${{ steps.version.outputs.number }}"
          node -e "
            const fs = require('fs');
            const file = 'src/pptxgen.ts';
            const src = fs.readFileSync(file, 'utf8');
            const updated = src.replace(/const VERSION = '[^']*'/, \"const VERSION = '$NUMBER'\");
            if (updated === src) { console.error('VERSION constant not found in ' + file); process.exit(1); }
            fs.writeFileSync(file, updated);
            console.log('Set VERSION = $NUMBER in ' + file);
          "

      - name: Roll CHANGELOG [Unreleased] into the new version
        run: |
          node tools/build/update-changelog.mjs "${{ steps.version.outputs.number }}"

      - name: Commit, tag, and push
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NUMBER="${{ steps.version.outputs.number }}"
          git add package.json package-lock.json src/pptxgen.ts CHANGELOG.md
          git commit -m "chore(release): $NUMBER"
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"

      - name: Trigger publish workflow for the new tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Dispatch publish.yml against the freshly-pushed tag. This is needed
          # because a tag pushed via GITHUB_TOKEN does not fire publish.yml's
          # `on: push: tags` trigger. workflow_dispatch is allowed here.
          gh workflow run publish.yml --ref "$TAG" -f tag="$TAG"
          echo "Dispatched publish.yml for $TAG"
