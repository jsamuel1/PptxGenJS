name: Version Bump and Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      preid:
        description: Prerelease identifier (only used when bump = prerelease)
        required: false
        default: beta
        type: string

permissions:
  contents: write # required to push the version commit and tag

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the default token so the pushed tag can trigger publish.yml.
          # Note: pushes made with GITHUB_TOKEN do not trigger other workflows.
          # A PAT (secrets.RELEASE_PAT) is required for the publish workflow to
          # run automatically on the new tag; otherwise tag/run it manually.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute and apply version bump
        id: version
        run: |
          if [ "${{ inputs.bump }}" = "prerelease" ]; then
            NEW_VERSION="$(npm version prerelease --preid="${{ inputs.preid }}" --no-git-tag-version)"
          else
            NEW_VERSION="$(npm version "${{ inputs.bump }}" --no-git-tag-version)"
          fi
          # npm version prints the new version prefixed with "v" (e.g. v4.2.0)
          echo "tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Sync VERSION constant in src/pptxgen.ts
        run: |
          NUMBER="${{ steps.version.outputs.number }}"
          node -e "
            const fs = require('fs');
            const file = 'src/pptxgen.ts';
            const src = fs.readFileSync(file, 'utf8');
            const updated = src.replace(/const VERSION = '[^']*'/, \"const VERSION = '$NUMBER'\");
            if (updated === src) { console.error('VERSION constant not found in ' + file); process.exit(1); }
            fs.writeFileSync(file, updated);
            console.log('Set VERSION = $NUMBER in ' + file);
          "

      - name: Commit, tag, and push
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NUMBER="${{ steps.version.outputs.number }}"
          git add package.json package-lock.json src/pptxgen.ts
          git commit -m "chore(release): $NUMBER"
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"
