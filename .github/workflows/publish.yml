name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v4.1.1)
        required: true
        type: string

permissions:
  contents: write # required to create GitHub Releases
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Resolve the ref to publish: the dispatched tag input, or the pushed tag.
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm 11.5.1+, which is newer than the
      # version bundled with the Node.js release above.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Install OOXML validator
        run: ./tools/ooxml-validator/install.sh

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${TAG_REF#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "package.json:    $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
        env:
          TAG_REF: ${{ steps.tag.outputs.ref }}

      # Build ONCE. `npm run ship` (SHIP=1) emits both the intermediate
      # src/bld/* artifacts that the tests import AND the full published dist/*
      # set including the self-contained browser bundle (dist/pptxgen.bundle.js).
      # Every later step reuses these artifacts instead of rebuilding.
      - name: Build (ship artifacts)
        run: npm run ship

      # Run the test runners directly against the freshly built src/bld/*.
      # Invoking the runners (not `npm test`) skips the `pretest` rebuild.
      - name: Test
        run: node test/run.js && node test/run-schema.js

      # No NODE_AUTH_TOKEN needed: npm authenticates via GitHub's OIDC token.
      # Provenance is generated automatically under trusted publishing.
      # --ignore-scripts skips `prepublishOnly` so dist/ is NOT rebuilt — we
      # publish the exact artifacts produced by the single build above.
      - name: Publish to npm
        run: |
          if [[ "$TAG_REF" == *-beta* || "$TAG_REF" == *-alpha* || "$TAG_REF" == *-rc* ]]; then
            npm publish --access public --tag beta --ignore-scripts
          else
            npm publish --access public --ignore-scripts
          fi
        env:
          TAG_REF: ${{ steps.tag.outputs.ref }}

      # Pack the exact tarball (same `files` set npm publishes). --ignore-scripts
      # skips the prepack/prepublishOnly rebuild so it packs the already-built
      # dist/. Attaching it gives a verifiable, registry-independent copy
      # installable via `npm install ./<tarball>.tgz`.
      - name: Pack npm tarball
        id: pack
        run: |
          TARBALL="$(npm pack --ignore-scripts | tail -n 1)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"

      # Create a GitHub Release for the tag and attach the browser bundle and
      # the npm tarball. Auto-generated notes summarize the commits since the
      # previous release. Pre-release tags are flagged so they do not show up as
      # the "Latest" release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REF: ${{ steps.tag.outputs.ref }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG_REF" == *-beta* || "$TAG_REF" == *-alpha* || "$TAG_REF" == *-rc* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          ASSETS=(
            "$TARBALL"
            dist/pptxgen.bundle.js
            dist/pptxgen.min.js
            dist/pptxgen.min.js.map
            dist/pptxgen.cjs.js
            dist/pptxgen.es.js
          )
          if gh release view "$TAG_REF" >/dev/null 2>&1; then
            echo "Release $TAG_REF already exists; uploading/clobbering assets."
            gh release upload "$TAG_REF" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_REF" \
              --title "$TAG_REF" \
              --generate-notes \
              $PRERELEASE_FLAG \
              "${ASSETS[@]}"
          fi
