name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v4.1.1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Resolve the ref to publish: the dispatched tag input, or the pushed tag.
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm 11.5.1+, which is newer than the
      # version bundled with the Node.js release above.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Install OOXML validator
        run: ./tools/ooxml-validator/install.sh

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${TAG_REF#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "package.json:    $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
        env:
          TAG_REF: ${{ steps.tag.outputs.ref }}

      - name: Build and test
        run: npm test

      # No NODE_AUTH_TOKEN needed: npm authenticates via GitHub's OIDC token.
      # Provenance is generated automatically under trusted publishing.
      - name: Publish to npm
        run: |
          if [[ "$TAG_REF" == *-beta* || "$TAG_REF" == *-alpha* || "$TAG_REF" == *-rc* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
        env:
          TAG_REF: ${{ steps.tag.outputs.ref }}
