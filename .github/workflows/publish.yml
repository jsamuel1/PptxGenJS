name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm 11.5.1+, which is newer than the
      # version bundled with the Node.js release above.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Install OOXML validator
        run: ./tools/ooxml-validator/install.sh

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "package.json:    $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build and test
        run: npm test

      # No NODE_AUTH_TOKEN needed: npm authenticates via GitHub's OIDC token.
      # Provenance is generated automatically under trusted publishing.
      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta* || "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-rc* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
