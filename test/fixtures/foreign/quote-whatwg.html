<!-- Quote patterns: figure/figcaption, footer, <q>, CJK glyphs -->

<!-- WHATWG figure > blockquote + figcaption -->
<div id="figure-quote">
  <figure>
    <blockquote>
      <p>The future is already here — it's just not evenly distributed.</p>
    </blockquote>
    <figcaption>William Gibson</figcaption>
  </figure>
</div>

<!-- footer attribution inside blockquote -->
<div id="footer-quote">
  <blockquote>
    <p>Any sufficiently advanced technology is indistinguishable from magic.</p>
    <footer>Arthur C. Clarke</footer>
  </blockquote>
</div>

<!-- inline <q> element -->
<div id="q-element">
  <q>To be or not to be, that is the question.</q>
</div>

<!-- CJK quote glyphs -->
<div id="cjk-quote">
  <blockquote>「未来はすでにここにある」</blockquote>
</div>
